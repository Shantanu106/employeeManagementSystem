<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #ffffff;
        overflow: hidden;
    }
    body::before, body::after {
        content: '';
        position: absolute;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 50%;
        z-index: -1;
        animation: float 15s infinite ease-in-out;
    }

    body::before {
        width: 300px;
        height: 300px;
        top: 10%;
        left: 5%;
    }

    body::after {
        width: 200px;
        height: 200px;
        bottom: 15%;
        right: 10%;
        animation-delay: 2s;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-30px); }
    }
    .profile-card {
        width: 90%;
        max-width: 450px;
        padding: 40px 30px;
        text-align: center;

        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid rgba(255, 255, 255, 0.3);
        border-left: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
        transition: transform 0.3s ease;
    }

    .profile-card:hover {
        transform: translateY(-5px);
    }
    h1 {
        font-size: 2.2rem;
        font-weight: 600;
        margin-bottom: 30px;
        letter-spacing: 1px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.15);
    }

    .profile-info {
        text-align: left;
        margin: 0 auto;
        max-width: 300px;
    }

    .profile-info p {
        margin: 15px 0;
        font-size: 1.1rem;
        font-weight: 300;
    }

    .profile-info b {
        font-weight: 600;
        margin-right: 10px;
    }
    .button-group {
        margin-top: 35px;
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    button {
        padding: 12px 25px;
        border: none;
        border-radius: 50px;
        background: rgba(255, 255, 255, 0.2);
        color: #ffffff;
        font-family: 'Poppins', sans-serif;
        font-size: 0.95rem;
        font-weight: 400;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    button:hover {
        background: rgba(255, 255, 255, 0.4);
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }

    button:active {
        transform: translateY(-1px);
    }
  </style>
</head>
<body>

<div class="profile-card">
  <h1>Admin Profile</h1>

  <div class="profile-info">
    <p><b>Username:</b> <span th:text="${admin.username}">adminUsername</span></p>
    <p><b>Password:</b> <span th:text="${admin.password}">adminPassword</span></p>
  </div>

  <div class="button-group">
    <button onclick="window.location.href='/admin/editProfile'">Edit Profile</button>
    <button onclick="window.location.href='/admin/adminDashboard'">Dashboard</button>
  </div>
</div>

</body>
</html>
