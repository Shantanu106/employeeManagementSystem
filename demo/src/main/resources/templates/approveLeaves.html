<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approve Leave Requests</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
        --success-color: #2ecc71;
        --danger-color: #e74c3c;
        --text-color: #ffffff;
        --border-color-light: rgba(255, 255, 255, 0.18);
    }

    *, *::before, *::after {
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: var(--text-color);
        min-height: 100vh;
    }
    .page-container {
        transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .page-container.shifted {
        margin-left: 240px;
    }

    main {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }
    #sidebar {
        width: 240px;
        height: 100vh;
        position: fixed;
        top: 0;
        left: -240px;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-right: 1px solid var(--border-color-light);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);

        display: flex;
        flex-direction: column;
        padding: 1.5rem 1rem;
        transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow-y: auto;
        color: var(--text-color);
    }
    #sidebar.active {
        left: 0;
    }
    #sidebar h3 {
        font-family: 'Poppins', sans-serif;
        font-weight: 600;
        text-align: right;
        padding-bottom: 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        margin: 0 0 1rem 0;
    }
    #sidebar ul { list-style: none; padding: 0; margin: 0; }
    #sidebar ul li a {
        font-family: 'Poppins', sans-serif;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.8rem 1rem;
        border-radius: 8px;
        margin-bottom: 0.25rem;
        font-weight: 400;
        color: var(--text-color);
        text-decoration: none;
        transition: background-color 0.2s ease;
    }
    #sidebar ul li a:hover, #sidebar ul li a:focus-visible {

        background-color: rgba(255, 255, 255, 0.2);
        outline: none;
    }

    #menuToggle {
        position: fixed;
        top: 1.5rem;
        left: 1.5rem;
        z-index: 1001;
        width: 50px;
        height: 50px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border-color-light);
        border-radius: 50%;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        transition: all 0.2s ease;
        color: var(--text-color);
    }
    #menuToggle:hover {
        transform: scale(1.1);
        background: rgba(255, 255, 255, 0.2);
    }

    .glass-container {
        width: 90%;
        max-width: 1200px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 20px;
        border: 1px solid var(--border-color-light);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        padding: 30px;
    }
    h1 {
        text-align: center;
        font-weight: 600;
        margin-bottom: 30px;
        letter-spacing: 1px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    th, td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    thead th {
        font-weight: 600;
        color: rgba(255, 255, 255, 0.9);
    }
    tbody tr {
        transition: background-color 0.3s ease;
    }
    tbody tr:last-child td {
        border-bottom: none;
    }
    tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.1);
    }
    td {
        color: rgba(255, 255, 255, 0.85);
    }
    .action-buttons a {
        text-decoration: none;
        color: white;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 400;
        transition: all 0.3s ease;
        margin-right: 8px;
    }
    .button-approve {
        background-color: var(--success-color);
    }
    .button-approve:hover {
        background-color: #27ae60;
        box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        transform: translateY(-2px);
    }
    .button-reject {
        background-color: var(--danger-color);
    }
    .button-reject:hover {
        background-color: #c0392b;
        box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        transform: translateY(-2px);
    }

    @media (max-width: 768px) {
        .page-container.shifted { margin-left: 0; }
        main { padding: 1rem; }
        .glass-container { padding: 20px; }
        th, td { padding: 10px; }
        .action-buttons a { display: block; margin: 5px 0; text-align: center;}
    }
  </style>
</head>
<body>

<nav id="sidebar" aria-label="Main Navigation">
  <h3>Admin Menu</h3>
  <ul>
    <li><a href="/admin">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Dashboard</span>
    </a></li>
    <li><a href="/admin/departments">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"></path><path d="M9 17H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-4"></path><path d="M15 17h-2a1 1 0 0 0-1 1v4h4v-4a1 1 0 0 0-1-1z"></path></svg>
      <span>Departments</span>
    </a></li>
    <li><a href="/admin/attendance">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="m9 16 2 2 4-4"></path></svg>
      <span>Attendance</span>
    </a></li>
    <li><a href="/admin/payroll">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M3 10h18"></path><path d="M7 15h.01"></path></svg>
      <span>Payroll</span>
    </a></li>
    <li><a href="/admin/reports">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 2H8.6c-.4 0-.8.2-1.1.5-.3.3-.5.7-.5 1.1V21c0 .8.7 1.5 1.5 1.5s1.5-.7 1.5-1.5V3h6v18c0 .8.7 1.5 1.5 1.5s1.5-.7 1.5-1.5V3.6c0-.4-.2-.8-.5-1.1-.3-.3-.7-.5-1.1-.5z"></path></svg>
      <span>Reports</span>
    </a></li>
    <li><a href="/admin/profile">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>Profile</span>
    </a></li>
    <li><a href="/admin/logout">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      <span>Logout</span>
    </a></li>
  </ul>
</nav>

<div class="page-container">
  <button id="menuToggle" aria-label="Toggle Navigation Menu" aria-expanded="false" aria-controls="sidebar">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>
  <main>
    <div class="glass-container">
      <h1>Pending Leave Requests</h1>
      <table>
        <thead>
        <tr>
          <th>ID</th>
          <th>Employee</th>
          <th>Department</th>
          <th>From</th>
          <th>To</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="leave : ${leaves}">
          <td th:text="${leave.id}"></td>
          <td th:text="${leave.employeeName}"></td>
          <td th:text="${leave.department}"></td>
          <td th:text="${leave.startDate}"></td>
          <td th:text="${leave.endDate}"></td>
          <td th:text="${leave.status}"></td>
          <td class="action-buttons">
            <a class="button-approve" th:href="@{/admin/approveLeave/{id}(id=${leave.id})}">Approve</a>
            <a class="button-reject" th:href="@{/admin/rejectLeave/{id}(id=${leave.id})}">Reject</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
      const sidebar = document.getElementById('sidebar');
      const pageContainer = document.querySelector('.page-container');
      const menuToggle = document.getElementById('menuToggle');

      if (menuToggle) {
          menuToggle.addEventListener('click', () => {
              sidebar.classList.toggle('active');
              pageContainer.classList.toggle('shifted');
              const isExpanded = sidebar.classList.contains('active');
              menuToggle.setAttribute('aria-expanded', isExpanded);
          });
      }
  });
</script>

</body>
</html>
