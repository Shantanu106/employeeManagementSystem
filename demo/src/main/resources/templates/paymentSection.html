<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Details - Coming Soon</title>
  <link rel="stylesheet" href="/css/employee-dashboard.css">

  <style>
    body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #f0f4ff, #e2e8f0);
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
    }

    nav {
        background-color: #1e293b;
        color: white;
        padding: 1rem;
    }

    .page-container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .coming-soon {
        background: white;
        padding: 3rem;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
        max-width: 400px;
    }

    .coming-soon h2 {
        font-size: 2rem;
        color: #1e3a8a;
        margin-bottom: 0.5rem;
    }

    .coming-soon p {
        color: #475569;
        font-size: 1.1rem;
        margin-bottom: 1.5rem;
    }

    .emoji {
        font-size: 3rem;
        margin-bottom: 1rem;
    }

    .back-btn {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background-color: #1e3a8a;
        color: white;
        font-weight: 500;
        border-radius: 8px;
        text-decoration: none;
        transition: background-color 0.3s, transform 0.2s;
    }

    .back-btn:hover {
        background-color: #3b82f6;
        transform: translateY(-2px);
    }
  </style>
</head>
<body>
<nav>
  <h3>Employee Portal</h3>
</nav>

<div class="page-container">
  <div class="coming-soon">
    <div class="emoji">💳</div>
    <h2>Payment Details</h2>
    <p>Feature under development.<br>Coming soon!</p>

    <!-- Back to Dashboard button -->
    <a href="/employee/dashboard" class="back-btn">← Back to Dashboard</a>
  </div>
</div>
</body>
</html>
