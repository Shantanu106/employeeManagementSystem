<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Generate Reports</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
        --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --font-size-h1: clamp(1.75rem, 1.25rem + 2vw, 2.5rem);

        --bg-main: #f3f4f8;
        --bg-content: rgba(255, 255, 255, 0.6);
        --bg-sidebar: rgba(30, 41, 59, 0.8);
        --text-primary: #0f172a;
        --text-secondary: #64748b;
        --text-inverted: #f8fafc;
        --accent-primary: #3b82f6;
        --accent-primary-hover: #2563eb;
        --border-color: rgba(0, 0, 0, 0.07);
        --shadow-color: rgba(0, 0, 0, 0.1);
        --row-hover-bg: rgba(0, 0, 0, 0.03);
    }

    body.dark-theme {
        --bg-main: #0f172a;
        --bg-content: rgba(30, 41, 59, 0.5);
        --bg-sidebar: rgba(15, 23, 42, 0.7);
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-inverted: #0f172a;
        --border-color: rgba(255, 255, 255, 0.1);
        --shadow-color: rgba(0, 0, 0, 0.3);
        --row-hover-bg: rgba(255, 255, 255, 0.05);
    }

    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: var(--font-family);
        background-color: var(--bg-main);
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
    }

    .page-container {
        transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #sidebar {
        width: 240px;
        height: 100vh;
        position: fixed;
        top: 0;
        left: -240px;
        z-index: 1000;
        background: var(--bg-sidebar);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        padding: 1.5rem 1rem;
        color: var(--text-inverted);
        transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow-y: auto;
    }

    #sidebar.active {
        left: 0;
    }

    #sidebar h3 {
        font-weight: 700;
        text-align: right;
        padding-bottom: 1rem;
        padding-right: 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 1rem;
    }

    #sidebar ul { list-style: none; }
    #sidebar ul li a {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.8rem 1rem;
        border-radius: 6px;
        margin-bottom: 0.25rem;
        font-weight: 500;
        color: var(--text-inverted);
        text-decoration: none;
        transition: background-color 0.2s ease, color 0.2s ease;
    }

    #sidebar ul li a.active, #sidebar ul li a:hover, #sidebar ul li a:focus-visible {
        background-color: var(--accent-primary);
        color: var(--text-inverted);
        outline: none;
    }

    main {
        padding: 2rem;
    }

    .page-container.shifted {
        margin-left: 240px;
    }

    .content-header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 1rem;
        height: 40px;
    }

    .card h1 {
        font-size: var(--font-size-h1);
        font-weight: 800;
        margin-bottom: 1.5rem;
    }

    .card {
        background: var(--bg-content);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 2rem;
        border-radius: 12px;
        border: 1px solid var(--border-color);
        box-shadow: 0 8px 32px 0 var(--shadow-color);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1.5rem;
    }

    th, td {
        padding: 1rem;
        text-align: left;
        border-bottom: 1px solid var(--border-color);
        color: var(--text-primary);
    }

    thead {
        background-color: rgba(0,0,0,0.02);
    }

    body.dark-theme thead {
         background-color: rgba(255,255,255,0.02);
    }

    th {
        font-weight: 600;
        color: var(--text-secondary);
    }

    tbody tr {
        transition: background-color 0.2s;
    }

    tbody tr:last-child td {
        border-bottom: none;
    }

    tbody tr:hover {
        background-color: var(--row-hover-bg);
    }

    .action-button {
        padding: 0.7rem 1.25rem;
        font-size: 0.9rem;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background-color: var(--accent-primary);
        color: white;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        box-shadow: 0 4px 15px -5px var(--accent-primary);
        transition: all 0.2s ease;
    }

    .action-button:hover {
        background-color: var(--accent-primary-hover);
        transform: translateY(-3px);
        box-shadow: 0 7px 20px -5px var(--accent-primary);
    }

    .actions a {
        padding: 0.4rem 0.8rem;
        text-decoration: none;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 500;
        color: #fff;
        background-color: var(--text-secondary);
        transition: background-color 0.2s, transform 0.2s;
        display: inline-block;
        margin-right: 0.5rem;
    }
    .actions a:hover {
        transform: translateY(-2px);
    }

    .actions a.delete {
        background-color: #dc3545;
    }
    .actions a.delete:hover {
        background-color: #c82333;
    }

    #menuToggle, #theme-toggle {
        display: grid;
        place-items: center;
        border: 1px solid var(--border-color);
        border-radius: 50%;
        cursor: pointer;
        background: var(--bg-content);
        backdrop-filter: blur(5px);
        transition: all 0.2s ease;
        color: var(--text-primary);
    }
    #menuToggle:hover, #theme-toggle:hover {
        transform: scale(1.1);
        color: var(--accent-primary);
        border-color: var(--accent-primary);
    }

    #menuToggle {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 1001;
        width: 50px;
        height: 50px;
    }

    #theme-toggle {
        width: 40px;
        height: 40px;
        font-size: 1.25rem;
        background-color: transparent;
        border: none;
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    @media (max-width: 768px) {
        main { padding: 1.5rem 1rem; }
        .page-container.shifted { margin-left: 0; }
        .content-header { justify-content: flex-end; }
    }

  </style>
</head>
<body>
<button id="menuToggle" aria-label="Toggle Menu">
  ☰
</button>

<nav id="sidebar" aria-label="Main Navigation">
  <h3>Admin Menu</h3>
  <ul>
    <li><a th:href="@{/admin/adminDashboard}">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Dashboard</span>
    </a></li>
    <li><a th:href="@{/admin/employees}">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <span>Employees</span>
    </a></li>
    <li><a th:href="@{/admin/departments}" class="active">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10"/></svg>
      <span>Departments</span>
    </a></li>
    <li><a th:href="@{/admin/attendance}">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="m9 16 2 2 4-4"></path></svg>
      <span>Attendance</span>
    </a></li>
    <li><a th:href="@{/admin/payroll}">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M16 8h-3a2 2 0 1 0 0 4h3a2 2 0 1 1 0 4h-3M12 18V6"/></svg>
      <span>Payroll</span>
    </a></li>
    <li><a th:href="@{/admin/reports}">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="20" y2="10" /><line x1="18" x2="18" y1="20" y2="4" /><line x1="6" x2="6" y1="20" y2="16" /></svg>
      <span>Reports</span>
    </a></li>
    <li><a th:href="@{/admin/profile}">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>Profile</span>
    </a></li>
    <li><a th:href="@{/admin/logout}">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      <span>Logout</span>
    </a></li>
  </ul>
</nav>
</head>

<div class="page-container">
  <main>
    <section class="content-card">
      <div class="coming-soon">
        🚧 <strong>Report Module Coming Soon!</strong><br>
        Stay tuned — this feature is under development.
      </div>
    </section>
  </main>
</div>

<script>
  const sidebar = document.getElementById('sidebar');
  const pageContainer = document.querySelector('.page-container');
  const menuToggle = document.getElementById('menuToggle');

  menuToggle.addEventListener('click', () => {
    sidebar.classList.toggle('active');
    pageContainer.classList.toggle('shifted');
  });

  function comingSoon(e) {
    e.preventDefault();
    alert('🚧 This feature will be available soon!');
  }
</script>
</body>

</html>
