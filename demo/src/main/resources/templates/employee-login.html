<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #6a11cb;
      --secondary-color: #2575fc;
      --text-color: #e0e0e0;
      --input-bg-color: rgba(255, 255, 255, 0.15);
      --border-color: rgba(255, 255, 255, 0.4);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1a2e;
      overflow: hidden;
      color: var(--text-color);
    }

    .background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
    }

    .blob {
        position: absolute;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
        filter: blur(80px);
        opacity: 0.5;
    }

    .blob1 {
        width: 400px;
        height: 400px;
        top: -150px;
        left: -150px;
        animation: move 15s infinite alternate;
    }

    .blob2 {
        width: 300px;
        height: 300px;
        bottom: -100px;
        right: -100px;
        animation: move 18s infinite alternate-reverse;
    }

    @keyframes move {
        from {
            transform: translate(0, 0) rotate(0deg);
        }
        to {
            transform: translate(200px, 100px) rotate(360deg);
        }
    }

    .login-container {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px); 
      width: 400px;
      text-align: center;
    }

    h2 {
      font-weight: 600;
      font-size: 2em;
      margin-bottom: 35px;
      color: #fff;
    }

    .input-group {
      position: relative;
      margin-bottom: 30px;
    }
    
    .input-group .icon {
        position: absolute;
        top: 50%;
        left: 15px;
        transform: translateY(-50%);
        color: var(--text-color);
        opacity: 0.8;
    }

    .input-group input {
      width: 100%;
      padding: 15px 15px 15px 50px;
      background: var(--input-bg-color);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 16px;
      color: #fff;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input::placeholder {
        color: rgba(255, 255, 255, 0.7);
    }
    
    .input-group input:focus {
        border-color: #fff;
        box-shadow: 0 0 15px rgba(106, 17, 203, 0.5);
    }
    .input-group label {
      position: absolute;
      top: 15px;
      left: 50px;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .input-group label[for="phone"] {
    font-size: 14px;
    }

    .input-group input:focus + label,
    .input-group input:not(:placeholder-shown) + label {
      top: -10px;
      left: 15px;
      font-size: 12px;
      background: #1a1a2e; 
      padding: 0 5px;
      color: #fff;
    }

    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(37, 117, 252, 0.4);
    }
    
    button:active {
        transform: translateY(-1px);
    }

    .note {
      margin-top: 25px;
      font-size: 14px;
      font-weight: 300;
    }

    .note a {
      color: #fff;
      font-weight: 400;
      text-decoration: none;
      transition: opacity 0.3s;
    }

    .note a:hover {
      opacity: 0.8;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="background">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
</div>

<div class="login-container">
  <h2>Employee Login</h2>
  <form action="/employee/login" method="post">
    
    <div class="input-group">
      <span class="icon"><i class="fa-solid fa-envelope"></i></span>
      <input type="email" id="email" name="email" placeholder=" " required>
      <label for="email">Email ID</label>
    </div>

    <div class="input-group">
      <span class="icon"><i class="fa-solid fa-lock"></i></span>
      <input type="password" id="phone" name="phone" placeholder=" " required>
      <label for="phone">Password(Your Phone Number)</label>
    </div>

    <button type="submit">Login</button>
  </form>

  <div class="note">
    Forgot your password? <a href="https://mail.google.com/mail/?view=cm&fs=1&to=shantanumondal5935w@gmail.com&su=Password%20Reset%20Request&body=Hello,%20I%20forgot%20my%20password%20for%20my%20account." target="_blank">Contact Admin</a>
  </div>
</div>

</body>
</html>
