<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
        }
        .page-container {
            display: flex;
            width: 100%;
            max-width: 900px;
            min-height: 600px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .left-panel {
            flex-basis: 40%;
            background-image: linear-gradient(160deg, #103c31 0%, #0d5e4c 100%);
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #ffffff;
        }

        .left-panel h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .left-panel p {
            font-size: 15px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
        }
        .right-panel {
            flex-basis: 60%;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-color: #fdfdfa;
        }

        h1 {
            color: #1a1a1a;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 35px;
            text-align: left;
        }
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFadeIn 0.5s ease-out forwards;
        }
        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }
        .form-group:nth-child(5) { animation-delay: 0.5s; }
        .button-group { animation-delay: 0.6s; }


        @keyframes slideUpFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        label {
            color: #444;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            color: #333;
            background-color: #fff;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #0d5e4c;
            box-shadow: 0 0 0 3px rgba(13, 94, 76, 0.15);
        }

        input[readonly] {
            background-color: #f0f0f0;
            color: #777;
            cursor: not-allowed;
            border-color: #e0e0e0;
        }

        input[readonly]:focus {
            box-shadow: none;
            border-color: #e0e0e0;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFadeIn 0.5s ease-out forwards;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background-color: #0d5e4c;
            color: white;
        }

        .btn-submit:hover {
            background-color: #0a4a3c;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -5px rgba(13, 94, 76, 0.4);
        }

        .btn-cancel {
            background-color: #e9e9e9;
            color: #555;
        }

        .btn-cancel:hover {
            background-color: #ddd;
        }
        @media (max-width: 900px) {
            body { align-items: flex-start; }
            .page-container {
                flex-direction: column;
                min-height: auto;
                max-width: 500px;
                margin: 20px;
            }
            .left-panel, .right-panel {
                flex-basis: auto;
                padding: 40px;
            }
            .left-panel { text-align: center; }
            h1 { font-size: 28px; }
        }
    </style>
</head>
<body>

<div class="page-container">
    <div class="left-panel">
        <h2>Your Profile</h2>
        <p>Manage your personal information to ensure our records are accurate. Your details are safe with us.</p>
    </div>
    <div class="right-panel">
        <h1>Edit Profile</h1>
        <form th:action="@{/employee/updateProfile}" th:object="${employee}" method="post">

            <div class="form-group">
                <label for="id">Employee ID</label>
                <input type="text" id="id" th:field="*{id}" readonly />
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" th:field="*{department}" readonly />
            </div>

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" th:field="*{name}" required />
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" required />
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" th:field="*{phone}" required />
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">Save Changes</button>
                <button type="button" class="btn-cancel" onclick="window.location.href='/employee/dashboard'">Cancel</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
