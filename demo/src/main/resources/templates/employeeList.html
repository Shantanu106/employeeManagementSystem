<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6a11cb;
            --secondary-color: #2575fc;
            --text-color: #e0e0e0;
            --glass-bg-color: rgba(255, 255, 255, 0.1);
            --glass-border-color: rgba(255, 255, 255, 0.4);
            --delete-color: #ff4757;
            --edit-color: #2ecc71;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            background: #1a1a2e;
            overflow-y: auto;
            color: var(--text-color);
        }

        .background {
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            filter: blur(80px);
            opacity: 0.5;
        }

        .blob1 {
            width: 400px;
            height: 400px;
            top: -150px;
            left: -150px;
            animation: move 15s infinite alternate;
        }

        .blob2 {
            width: 300px;
            height: 300px;
            bottom: -100px;
            right: -100px;
            animation: move 18s infinite alternate-reverse;
        }

        @keyframes move {
            from { transform: translate(0, 0) rotate(0deg); }
            to { transform: translate(200px, 100px) rotate(360deg); }
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--glass-bg-color);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-weight: 700;
            font-size: 2.2em;
            color: #fff;
        }
        
        .search-form {
            display: flex;
            gap: 10px;
        }

        .search-form input {
            width: 280px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--glass-border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-form input::placeholder { color: rgba(255, 255, 255, 0.7); }
        .search-form input:focus { border-color: #fff; box-shadow: 0 0 15px rgba(106, 17, 203, 0.5); }
        
        .btn {
            text-decoration: none;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
        }

        .btn-add {
            margin-bottom: 25px;
        }

        .table-wrapper {
            overflow-x: auto; 
        }

        .employee-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 10px;
        }

        .employee-table th, .employee-table td {
            padding: 15px;
            vertical-align: middle;
        }

        .employee-table thead {
            background: rgba(255, 255, 255, 0.15);
        }

        .employee-table th {
            font-weight: 600;
            color: #fff;
        }

        .employee-table tbody tr {
            border-bottom: 1px solid var(--glass-border-color);
            transition: background-color 0.3s ease;
        }

        .employee-table tbody tr:last-child {
            border-bottom: none;
        }

        .employee-table tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .actions-cell {
            display: flex;
            gap: 10px;
        }

        .btn-edit { background: var(--edit-color); }
        .btn-delete { background: var(--delete-color); }

    </style>
</head>
<body>

<div class="background">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
</div>

<div class="container">
    <div class="header">
        <h1>Employee List</h1>
        <form th:action="@{/admin/search}" method="get" class="search-form">
            <input type="text" name="keyword" placeholder="Search by Name, ID, or Department"
                   th:value="${keyword}">
            <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> Search</button>
        </form>
    </div>

    <a class="btn btn-primary btn-add" th:href="@{/admin/addEmployee}">
        <i class="fas fa-user-plus"></i> Add New Employee
    </a>

    <div class="table-wrapper">
        <table class="employee-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Phone</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.name}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.department}"></td>
                <td th:text="${emp.phone}"></td>
                <td th:text="'$' + ${#numbers.formatDecimal(emp.salary, 1, 'COMMA', 2, 'POINT')}"></td>
                <td class="actions-cell">
                    <a class="btn btn-edit" th:href="@{/admin/editEmployee/{id}(id=${emp.id})}">
                        <i class="fas fa-edit"></i>
                    </a>
                    <a class="btn btn-delete" th:href="@{/admin/deleteEmployee/{id}(id=${emp.id})}">
                        <i class="fas fa-trash-alt"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
