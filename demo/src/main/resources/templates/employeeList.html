<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee List</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-family: 'Inter', sans-serif;
            --bg-main: #f3f4f8;
            --bg-content: rgba(255, 255, 255, 0.6);
            --bg-sidebar: rgba(30, 41, 59, 0.8);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-inverted: #f8fafc;
            --accent-primary: #3b82f6;
            --accent-primary-hover: #2563eb;
            --border-color: rgba(0, 0, 0, 0.07);
            --shadow-color: rgba(0, 0, 0, 0.1);
            --table-header-bg: rgba(0, 0, 0, 0.05);
            --delete-color: #ef4444;
            --edit-color: #22c55e;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-main);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
            min-height: 100vh;
        }

        #sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: -240px;
            z-index: 1000;
            background: var(--bg-sidebar);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 1rem;
            color: var(--text-inverted);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #sidebar.active { left: 0; }

        #sidebar h3 {
            font-weight: 700;
            text-align: right;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 1rem;
            color: var(--text-inverted);
        }

        #sidebar ul { list-style: none; }
        #sidebar ul li a {
            color: var(--text-inverted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 6px;
            margin-bottom: 0.25rem;
            font-weight: 500;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        #sidebar ul li a:hover {
            background-color: var(--accent-primary);
            color: var(--text-inverted);
        }


        .page-container {
            padding: 1.5rem;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .page-container.shifted {
            margin-left: 240px;
        }

        #menuToggle {
            display: grid;
            place-items: center;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            background: var(--bg-content);
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            color: var(--text-primary);
        }
        #menuToggle:hover {
            transform: scale(1.1);
            color: var(--accent-primary);
            border-color: var(--accent-primary);
        }
        #menuToggle {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1001;
            width: 50px;
            height: 50px;
        }

        .content-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-content);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 8px 32px 0 var(--shadow-color);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.25rem;
            margin-bottom: 2rem;
        }
        h1 {
            font-weight: 800;
            font-size: clamp(1.75rem, 1.25rem + 2vw, 2.5rem);
            color: var(--text-primary);
        }
        
        .search-form {
            display: flex;
            gap: 0.5rem;
        }
        .search-form input {
            width: 280px;
            padding: 0.6rem 1rem;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .search-form input::placeholder { color: var(--text-secondary); }
        .search-form input:focus { 
            border-color: var(--accent-primary); 
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-primary) 25%, transparent);
        }

        .btn {
            text-decoration: none;
            padding: 0.6rem 1.25rem;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px -5px rgba(0,0,0,0.2);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px -5px rgba(0,0,0,0.3);
        }
        .btn-primary { background-color: var(--accent-primary); }
        .btn-primary:hover { background-color: var(--accent-primary-hover); }
        .btn-add { margin-bottom: 1.5rem; }
        .btn-edit { background-color: var(--edit-color); }
        .btn-delete { background-color: var(--delete-color); }
        
        .actions-cell .btn {
            width: 40px;
            height: 40px;
            padding: 0;
            font-size: 1rem;
        }

        .table-wrapper { overflow-x: auto; }
        .employee-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 1rem;
        }
        .employee-table th, .employee-table td {
            padding: 1rem;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-color);
        }
        .employee-table thead {
            background: var(--table-header-bg);
        }
        .employee-table th {
            font-weight: 600;
            color: var(--text-primary);
        }
        .employee-table tbody tr {
            transition: background-color 0.3s ease;
        }
        .employee-table tbody tr:last-child td {
            border-bottom: none;
        }
        .employee-table tbody tr:hover {
            background-color: color-mix(in srgb, var(--bg-content) 50%, transparent);
        }
        .actions-cell {
            display: flex;
            gap: 0.5rem;
        }
        @media (max-width: 768px) {
            .page-container { padding: 1rem; }
            .page-container.shifted { margin-left: 0; }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .search-form { width: 100%; }
            .search-form input { width: 100%; }
            .content-wrapper { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<nav id="sidebar" aria-label="Main Navigation">
    <h3>Admin Menu</h3>
    <ul>
        <li><a href="/admin">
            <i class="fas fa-home"></i> <span>Dashboard</span>
        </a></li>
        <li><a href="/admin/employees">
            <i class="fas fa-users"></i> <span>Employees</span>
        </a></li>
        <li><a href="/admin/departments">
            <i class="fas fa-building"></i> <span>Departments</span>
        </a></li>
        <li><a href="/admin/attendance">
            <i class="fas fa-calendar-check"></i> <span>Attendance</span>
        </a></li>
        <li><a href="/admin/payroll">
            <i class="fas fa-money-bill-wave"></i> <span>Payroll</span>
        </a></li>
        <li><a href="/admin/reports">
            <i class="fas fa-chart-pie"></i> <span>Reports</span>
        </a></li>
        <li><a href="/admin/profile">
            <i class="fas fa-user-circle"></i> <span>Profile</span>
        </a></li>
         <li><a href="/admin/logout">
            <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
        </a></li>
    </ul>
</nav>

<div class="page-container">
    <button id="menuToggle" aria-label="Toggle Navigation Menu" aria-expanded="false" aria-controls="sidebar">
        <i class="fas fa-bars"></i>
    </button>

    <main id="main-content">
        <div class="content-wrapper">
            <div class="header">
                <h1>Employee List</h1>
                <form th:action="@{/admin/search}" method="get" class="search-form">
                    <input type="text" name="keyword" placeholder="Search by Name, ID, etc." th:value="${keyword}">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i></button>
                </form>
            </div>

            <a class="btn btn-primary btn-add" th:href="@{/admin/addEmployee}">
                <i class="fas fa-user-plus"></i> Add New Employee
            </a>

            <div class="table-wrapper">
                <table class="employee-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Phone</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="emp : ${employees}">
                            <td th:text="${emp.id}"></td>
                            <td th:text="${emp.name}"></td>
                            <td th:text="${emp.email}"></td>
                            <td th:text="${emp.department}"></td>
                            <td th:text="${emp.phone}"></td>
                            <td th:text="'$' + ${#numbers.formatDecimal(emp.salary, 1, 'COMMA', 2, 'POINT')}"></td>
                            <td class="actions-cell">
                                <a class="btn btn-edit" th:href="@{/admin/editEmployee/{id}(id=${emp.id})}">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a class="btn btn-delete" th:href="@{/admin/deleteEmployee/{id}(id=${emp.id})}">
                                    <i class="fas fa-trash-alt"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {

        const sidebar = document.getElementById('sidebar');
        const pageContainer = document.querySelector('.page-container');
        const menuToggle = document.getElementById('menuToggle');

        if (menuToggle) {
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('active');
                pageContainer.classList.toggle('shifted');
                const isExpanded = sidebar.classList.contains('active');
                menuToggle.setAttribute('aria-expanded', isExpanded);
            });
        }
    });
</script>

</body>
</html>
