<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f6f2;
        }
        .page-container {
            display: flex;
            width: 100%;
            max-width: 900px;
            min-height: 600px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .left-panel {
            flex-basis: 40%;
            background-image: linear-gradient(160deg, #0052D4 0%, #4364F7 100%); 
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #ffffff;
        }

        .left-panel h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .left-panel p {
            font-size: 15px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.85);
        }
        .right-panel {
            flex-basis: 60%;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            color: #2c3e50; 
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 35px;
            text-align: left;
        }
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFadeIn 0.5s ease-out forwards;
        }
        .form-group:nth-child(2) { animation-delay: 0.1s; }
        .form-group:nth-child(3) { animation-delay: 0.2s; }
        .form-group:nth-child(4) { animation-delay: 0.3s; }
        .form-group:nth-child(5) { animation-delay: 0.4s; }
        .button-group { animation-delay: 0.5s; }


        @keyframes slideUpFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        label {
            color: #34495e; 
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="tel"] {
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            color: #2c3e50;
            background-color: #fdfcf9;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        input[type="tel"]:focus {
            outline: none;
            border-color: #4364F7; 
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(67, 100, 247, 0.15);
        }

        input::placeholder {
            color: #a9a9a9;
        }
        
        input[type="hidden"] {
            display: none;
        }
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFadeIn 0.5s ease-out forwards;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit {
            background-color: #4364F7; 
            color: white;
        }

        .btn-submit:hover {
            background-color: #3a5cdc;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -5px rgba(67, 100, 247, 0.4);
        }

        .btn-cancel {
            background-color: #f0f0f0;
            color: #555;
        }

        .btn-cancel:hover {
            background-color: #e6e6e6;
        }
        @media (max-width: 900px) {
            .page-container {
                flex-direction: column;
                min-height: auto;
                max-width: 500px;
                margin: 20px;
            }
            .left-panel {
                flex-basis: auto;
                text-align: center;
                padding: 40px;
            }
            .right-panel {
                padding: 40px;
            }
            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

<div class="page-container">
    <div class="left-panel">
        <h2>Update Details</h2>
        <p>Keep your employee records accurate and up-to-date. Every detail helps in maintaining a complete and efficient personnel database.</p>
    </div>
    <div class="right-panel">
        <h1>Edit Employee</h1>
        <form th:action="@{/admin/editEmployee}" th:object="${employee}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" th:field="*{name}" placeholder="Jane Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" placeholder="jane.doe@example.com" required>
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <input type="text" id="department" th:field="*{department}" placeholder="Engineering" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" th:field="*{phone}" placeholder="+91 XXXXXXXXXX" required>
            </div>

            <div class="form-group">
                <label for="salary">Salary</label>
                <input type="number" id="salary" th:field="*{salary}" placeholder="85000" step="0.01" required>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">Update Employee</button>
                <button type="button" class="btn-cancel" onclick="window.history.back()">Cancel</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
