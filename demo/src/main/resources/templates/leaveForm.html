<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Leave</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-200 dark:from-slate-900 dark:to-slate-800 text-slate-800 dark:text-slate-200">

<div class="flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md p-8 space-y-8 bg-white/80 dark:bg-slate-900/70 backdrop-blur-xl rounded-2xl shadow-2xl">

        <div class="text-center">
            <h2 class="text-3xl font-extrabold text-slate-900 dark:text-white">
                Request Time Off
            </h2>
            <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">
                Please select your desired leave dates below.
            </p>
        </div>

        <form th:action="@{/employee/apply}" th:object="${leave}" method="post" class="space-y-6">

            <div>
                <label for="startDate" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Start Date</label>
                <div class="relative">
                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                        <svg class="h-5 w-5 text-slate-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <input type="date" id="startDate" th:field="*{startDate}" required
                           class="block w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white/50 dark:bg-slate-800/50 py-2.5 pl-10 pr-3 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-indigo-500 sm:text-sm transition">
                </div>
            </div>

            <div>
                <label for="endDate" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">End Date</label>
                <div class="relative">
                    <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                        <svg class="h-5 w-5 text-slate-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <input type="date" id="endDate" th:field="*{endDate}" required
                           class="block w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white/50 dark:bg-slate-800/50 py-2.5 pl-10 pr-3 text-slate-900 dark:text-white placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-indigo-500 sm:text-sm transition">
                </div>
            </div>

            <div class="flex flex-col-reverse sm:flex-row items-center justify-between gap-4 pt-4">
                <button type="button" onclick="window.location.href='/employee/dashboard'"
                        class="w-full sm:w-auto flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-medium text-slate-700 dark:text-slate-200 bg-white/60 dark:bg-slate-800/60 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400 transition-all duration-200 hover:scale-105 active:scale-95">
                    <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Dashboard
                </button>

                <button type="submit"
                        class="w-full sm:w-auto flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-medium text-white bg-gradient-to-r from-indigo-600 to-purple-600 rounded-lg hover:from-indigo-700 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 dark:focus:ring-offset-slate-900 shadow-lg transition-all duration-200 hover:scale-105 active:scale-95">
                    Submit Request
                    <svg class="h-4 w-4 -rotate-45" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                    </svg>
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
