<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Employee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        /* --- Core Body and Layout Styles --- */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            background: linear-gradient(45deg, #e0f7fa, #e8f5e9);
            color: #424242;
        }

        .page-container {
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .page-container.shifted {
            margin-left: 240px;
        }

        main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem; /* Added padding for better spacing on smaller screens */
        }

        /* --- Sidebar Styles --- */
        #sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: -240px;
            z-index: 1000;
            background: rgba(30, 41, 59, 0.8); /* Using dashboard's sidebar color */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-right: 1px solid rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 1rem;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            color: #f8fafc; /* Text color for sidebar links */
        }
        #sidebar.active {
            left: 0;
        }
        #sidebar h3 {
            font-family: 'Inter', sans-serif; /* Sidebar uses its own font */
            font-weight: 700;
            text-align: right;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin: 0 0 1rem 0;
        }
        #sidebar ul { list-style: none; padding: 0; margin: 0; }
        #sidebar ul li a {
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 6px;
            margin-bottom: 0.25rem;
            font-weight: 500;
            color: #f8fafc;
            text-decoration: none;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        #sidebar ul li a:hover, #sidebar ul li a:focus-visible {
            background-color: #3b82f6; /* Accent color from dashboard */
            color: white;
            outline: none;
        }

        /* --- Menu Toggle Button --- */
        #menuToggle {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1001;
            width: 50px;
            height: 50px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 50%;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            color: #0f172a;
        }
        #menuToggle:hover {
            transform: scale(1.1);
            color: #3b82f6;
            border-color: #3b82f6;
        }

        /* --- Original Form Styles (Unchanged) --- */
        .form-container {
            width: 100%;
            max-width: 700px;
            padding: 40px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            border: 1px solid #e0e0e0;
        }
        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: 600;
            color: #333;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        .input-group { position: relative; }
        .input-group label {
            font-size: 0.9em;
            margin-bottom: 8px;
            display: block;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            font-size: 1em;
            font-family: 'Poppins', sans-serif;
            color: #333;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input::placeholder { color: #aaa; }
        input:focus {
            border-color: #00897b;
            box-shadow: 0 0 0 3px rgba(0, 137, 123, 0.1);
        }
        button#previewBtn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #00897b;
            color: white;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            margin-top: 30px;
        }
        button#previewBtn:hover {
            background-color: #00695c;
            transform: translateY(-2px);
        }
        .error { border: 1px solid #f5c6cb; background-color: #f8d7da; color: #721c24; margin-top: 8px; padding: 10px; border-radius: 6px; }
        .success { border: 1px solid #c3e6cb; background-color: #d4edda; color: #155724; margin-bottom: 20px; padding: 12px; border-radius: 6px; }

        /* --- Original Modal Styles (Unchanged) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #ffffff;
            padding: 30px; border-radius: 12px;
            width: 90%; max-width: 500px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-content h3 { margin-top: 0; text-align: center; color: #333; }
        .preview-details p {
            margin: 12px 0; font-size: 1.1em; padding-bottom: 12px;
            border-bottom: 1px solid #eee; display: flex; justify-content: space-between;
        }
        .preview-details strong { color: #555; font-weight: 500; }
        .preview-details p:last-child { border-bottom: none; }
        .modal-buttons { display: flex; justify-content: flex-end; margin-top: 25px; gap: 15px; }
        .modal-buttons button { padding: 10px 20px; border-radius: 8px; border: none; color: #fff; font-weight: 500; cursor: pointer; transition: background-color 0.2s; }
        #confirmBtn { background-color: #43a047; }
        #confirmBtn:hover { background-color: #388e3c; }
        #cancelBtn { background-color: #757575; }
        #cancelBtn:hover { background-color: #616161; }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .page-container.shifted { margin-left: 0; }
            .form-grid { grid-template-columns: 1fr; }
            main { padding: 1rem; }
            .form-container { padding: 25px; }
        }
    </style>
</head>
<body>

<nav id="sidebar" aria-label="Main Navigation">
    <h3>Admin Menu</h3>
    <ul>
        <li><a href="/admin">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Dashboard</span>
        </a></li>
        <li><a href="/admin/departments">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"></path><path d="M9 17H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-4"></path><path d="M15 17h-2a1 1 0 0 0-1 1v4h4v-4a1 1 0 0 0-1-1z"></path></svg>
            <span>Departments</span>
        </a></li>
        <li><a href="/admin/attendance">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="m9 16 2 2 4-4"></path></svg>
            <span>Attendance</span>
        </a></li>
        <li><a href="/admin/payroll">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M3 10h18"></path><path d="M7 15h.01"></path></svg>
            <span>Payroll</span>
        </a></li>
        <li><a href="/admin/reports">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 2H8.6c-.4 0-.8.2-1.1.5-.3.3-.5.7-.5 1.1V21c0 .8.7 1.5 1.5 1.5s1.5-.7 1.5-1.5V3h6v18c0 .8.7 1.5 1.5 1.5s1.5-.7 1.5-1.5V3.6c0-.4-.2-.8-.5-1.1-.3-.3-.7-.5-1.1-.5z"></path></svg>
            <span>Reports</span>
        </a></li>
        <li><a href="/admin/profile">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profile</span>
        </a></li>
        <li><a href="/admin/logout">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            <span>Logout</span>
        </a></li>
    </ul>
</nav>

<div class="page-container">
    <button id="menuToggle" aria-label="Toggle Navigation Menu" aria-expanded="false" aria-controls="sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <main>
        <div class="form-container">
            <h2>Add New Employee</h2>
            <div th:if="${successMessage}" class="success" th:text="${successMessage}"></div>

            <form id="employeeForm" th:action="@{/admin/addEmployee}" th:object="${employee}" method="post">
                <div class="form-grid">
                    <div class="input-group">
                        <label for="id">Employee ID</label>
                        <input type="text" id="id" th:field="*{id}" placeholder="e.g., E001" required/>
                        <div class="error" th:if="${#fields.hasErrors('id')}" th:errors="*{id}"></div>
                    </div>
                    <div class="input-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" th:field="*{name}" placeholder="e.g., John Doe" required/>
                        <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" th:field="*{email}" placeholder="john.doe@example.com" required/>
                        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="input-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" th:field="*{department}" placeholder="e.g., Technology" list="department-list" required/>
                        <datalist id="department-list">
                            <option value="Technology"></option><option value="Human Resources"></option><option value="Marketing"></option>
                            <option value="Sales"></option><option value="Finance"></option>
                        </datalist>
                        <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                    </div>
                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" th:field="*{phone}" placeholder="e.g., 9876543210" pattern="[0-9]{10}" required/>
                        <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>
                    <div class="input-group">
                        <label for="salary">Salary</label>
                        <input type="number" id="salary" th:field="*{salary}" placeholder="e.g., 50000" min="0" required/>
                        <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                    </div>
                </div>
                <button type="button" id="previewBtn">Preview & Add Employee</button>
            </form>
        </div>
    </main>
</div>

<div id="previewModal" class="modal-overlay">
    <div class="modal-content">
        <h3>Confirm Employee Details</h3>
        <div class="preview-details">
            <p><strong>Employee ID:</strong> <span id="previewId"></span></p>
            <p><strong>Full Name:</strong> <span id="previewName"></span></p>
            <p><strong>Email:</strong> <span id="previewEmail"></span></p>
            <p><strong>Department:</strong> <span id="previewDepartment"></span></p>
            <p><strong>Phone:</strong> <span id="previewPhone"></span></p>
            <p><strong>Salary:</strong> <span id="previewSalary"></span></p>
        </div>
        <div class="modal-buttons">
            <button type="button" id="cancelBtn">Go Back</button>
            <button type="button" id="confirmBtn">Confirm & Submit</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- Sidebar Functionality ---
        const sidebar = document.getElementById('sidebar');
        const pageContainer = document.querySelector('.page-container');
        const menuToggle = document.getElementById('menuToggle');

        if (menuToggle) {
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('active');
                pageContainer.classList.toggle('shifted');
                const isExpanded = sidebar.classList.contains('active');
                menuToggle.setAttribute('aria-expanded', isExpanded);
            });
        }

        // --- Original Form Modal Functionality ---
        const employeeForm = document.getElementById('employeeForm');
        const previewBtn = document.getElementById('previewBtn');
        const modal = document.getElementById('previewModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');

        previewBtn.addEventListener('click', () => {
            if (employeeForm.checkValidity()) {
                document.getElementById('previewId').textContent = document.getElementById('id').value;
                document.getElementById('previewName').textContent = document.getElementById('name').value;
                document.getElementById('previewEmail').textContent = document.getElementById('email').value;
                document.getElementById('previewDepartment').textContent = document.getElementById('department').value;
                document.getElementById('previewPhone').textContent = document.getElementById('phone').value;
                document.getElementById('previewSalary').textContent = document.getElementById('salary').value;
                modal.style.display = 'flex';
            } else {
                employeeForm.reportValidity();
            }
        });

        const closeModal = () => { modal.style.display = 'none'; };
        cancelBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (event) => { if (event.target === modal) { closeModal(); } });
        confirmBtn.addEventListener('click', () => { employeeForm.submit(); });
    });
</script>

</body>
</html>
