<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Employee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(45deg, #e0f7fa, #e8f5e9);
            color: #424242; 
        }
        .form-container {
            width: 100%;
            max-width: 700px;
            padding: 40px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            border: 1px solid #e0e0e0;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: 600;
            color: #333;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        
        .input-group { position: relative; }

        .input-group label {
            font-size: 0.9em;
            margin-bottom: 8px;
            display: block;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            font-size: 1em;
            font-family: 'Poppins', sans-serif;
            color: #333;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder { color: #aaa; }

        input:focus {
            border-color: #00897b;
            box-shadow: 0 0 0 3px rgba(0, 137, 123, 0.1);
        }
 
        button#previewBtn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #00897b; 
            color: white;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            margin-top: 30px;
        }

        button#previewBtn:hover {
            background-color: #00695c;
            transform: translateY(-2px);
        }
        
        .error { border: 1px solid #f5c6cb; background-color: #f8d7da; color: #721c24; margin-top: 8px; padding: 10px; border-radius: 6px; }
        .success { border: 1px solid #c3e6cb; background-color: #d4edda; color: #155724; margin-bottom: 20px; padding: 12px; border-radius: 6px; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        
        .modal-content {
            background: #ffffff;
            padding: 30px; border-radius: 12px;
            width: 90%; max-width: 500px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .modal-content h3 { margin-top: 0; text-align: center; color: #333; }

        .preview-details p {
            margin: 12px 0; font-size: 1.1em; padding-bottom: 12px;
            border-bottom: 1px solid #eee; display: flex; justify-content: space-between;
        }
        .preview-details strong { color: #555; font-weight: 500; }
        .preview-details p:last-child { border-bottom: none; }

        .modal-buttons { display: flex; justify-content: flex-end; margin-top: 25px; gap: 15px; }
        .modal-buttons button { padding: 10px 20px; border-radius: 8px; border: none; color: #fff; font-weight: 500; cursor: pointer; transition: background-color 0.2s; }
        #confirmBtn { background-color: #43a047; } 
        #confirmBtn:hover { background-color: #388e3c; }
        #cancelBtn { background-color: #757575; } 
        #cancelBtn:hover { background-color: #616161; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Add New Employee</h2>
    <div th:if="${successMessage}" class="success" th:text="${successMessage}"></div>
    
    <form id="employeeForm" th:action="@{/admin/addEmployee}" th:object="${employee}" method="post">
        <div class="form-grid">
            <div class="input-group">
                <label for="id">Employee ID</label>
                <input type="text" id="id" th:field="*{id}" placeholder="e.g., E001" required/>
                <div class="error" th:if="${#fields.hasErrors('id')}" th:errors="*{id}"></div>
            </div>
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" th:field="*{name}" placeholder="e.g., John Doe" required/>
                <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" th:field="*{email}" placeholder="john.doe@example.com" required/>
                <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="input-group">
                <label for="department">Department</label>
                <input type="text" id="department" th:field="*{department}" placeholder="e.g., Technology" list="department-list" required/>
                <datalist id="department-list">
                    <option value="Technology"></option><option value="Human Resources"></option><option value="Marketing"></option>
                    <option value="Sales"></option><option value="Finance"></option>
                </datalist>
                <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
            </div>
            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" th:field="*{phone}" placeholder="e.g., 9876543210" pattern="[0-9]{10}" required/>
                <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <div class="input-group">
                <label for="salary">Salary</label>
                <input type="number" id="salary" th:field="*{salary}" placeholder="e.g., 50000" min="0" required/>
                <div class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
            </div>
        </div>
        <button type="button" id="previewBtn">Preview & Add Employee</button>
    </form>
</div>

<div id="previewModal" class="modal-overlay">
    <div class="modal-content">
        <h3>Confirm Employee Details</h3>
        <div class="preview-details">
            <p><strong>Employee ID:</strong> <span id="previewId"></span></p>
            <p><strong>Full Name:</strong> <span id="previewName"></span></p>
            <p><strong>Email:</strong> <span id="previewEmail"></span></p>
            <p><strong>Department:</strong> <span id="previewDepartment"></span></p>
            <p><strong>Phone:</strong> <span id="previewPhone"></span></p>
            <p><strong>Salary:</strong> <span id="previewSalary"></span></p>
        </div>
        <div class="modal-buttons">
            <button type="button" id="cancelBtn">Go Back</button>
            <button type="button" id="confirmBtn">Confirm & Submit</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const employeeForm = document.getElementById('employeeForm');
        const previewBtn = document.getElementById('previewBtn');
        const modal = document.getElementById('previewModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const confirmBtn = document.getElementById('confirmBtn');

        previewBtn.addEventListener('click', () => {
            if (employeeForm.checkValidity()) {
                document.getElementById('previewId').textContent = document.getElementById('id').value;
                document.getElementById('previewName').textContent = document.getElementById('name').value;
                document.getElementById('previewEmail').textContent = document.getElementById('email').value;
                document.getElementById('previewDepartment').textContent = document.getElementById('department').value;
                document.getElementById('previewPhone').textContent = document.getElementById('phone').value;
                document.getElementById('previewSalary').textContent = document.getElementById('salary').value;
                modal.style.display = 'flex';
            } else {
                employeeForm.reportValidity();
            }
        });

        const closeModal = () => { modal.style.display = 'none'; };
        cancelBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (event) => { if (event.target === modal) { closeModal(); } });
        confirmBtn.addEventListener('click', () => { employeeForm.submit(); });
    });
</script>

</body>
</html>
