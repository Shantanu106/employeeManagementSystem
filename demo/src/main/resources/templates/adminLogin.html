<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #e0f2ff;
            background-image: url('https://images.unsplash.com/photo-1590212151007-3885b74613d7?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        .login-container {
            width: 400px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
            color: #333;
        }

        .top-icon {
            width: 50px;
            height: 50px;
            background-color: #fff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            font-size: 20px;
            color: #555;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subheading {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: none;
            background-color: #f0f4f8;
            border-radius: 10px;
            font-size: 14px;
            color: #333;
        }

        input::placeholder {
            color: #999;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #a8d5ff;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .show-password-group {
            display: flex;
            align-items: center;
            font-size: 12px;
            color: #555;
        }

        .show-password-group input[type="checkbox"] {
            width: auto;
            margin-right: 5px;
            accent-color: #333;
        }

        .forgot-password {
            font-size: 12px;
            color: #555;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-primary {
            background-color: #333;
            color: #fff;
            margin-bottom: 15px;
        }

        .btn-primary:hover {
            background-color: #555;
        }

        .error {
            color: #D8000C;
            background-color: #FFD2D2;
            border: 1px solid #D8000C;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="top-icon">
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
    </div>
    <h1>Admin Login</h1>
    <p class="subheading">Access your employee dashboard.</p>

    <form id="loginForm" action="/admin/login" method="post">
        <div class="input-group">
            <i class="fa-regular fa-user"></i>
            <input type="text" name="username" placeholder="Username" required>
        </div>
        <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" name="password" id="password" placeholder="Password" required>
        </div>

        <div class="form-options">
            <div class="show-password-group">
                <input type="checkbox" id="showPassword">
                <label for="showPassword">Show Password</label>
            </div>
            <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary">Login</button>
    </form>

    <div class="error" id="error-notification">
    </div>
</div>

<script>
    const showPasswordCheckbox = document.getElementById('showPassword');
    const passwordInput = document.getElementById('password');

    showPasswordCheckbox.addEventListener('change', function () {
        const type = this.checked ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
    });

    document.addEventListener('DOMContentLoaded', function() {
        const errorNotification = document.getElementById('error-notification');

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            errorNotification.textContent = 'Invalid username or password. Please try again.';
            errorNotification.style.display = 'block';
        }
    });
</script>

</body>
</html>
