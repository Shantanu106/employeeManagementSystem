<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Attendance | Modern UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #E0EAFC 0%, #CFDEF3 100%);
        }
        #sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: -240px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            padding: 1.5rem 1rem;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #sidebar.active { left: 0; }

        #sidebar h3 {
            font-weight: 600;
            text-align: right;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            margin-bottom: 1rem;
            color: #333;
        }

        #sidebar ul { list-style: none; }
        #sidebar ul li a {
            color: #333;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 6px;
            margin-bottom: 0.25rem;
            font-weight: 500;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        #sidebar ul li a:hover {
            background-color: #3b82f6;
            color: #fff;
        }
        #sidebar ul li a i {
            width: 20px;
            text-align: center;
        }

        .page-container {
            padding: 2.5rem;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .page-container.shifted {
            margin-left: 240px;
        }

        #menuToggle {
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            color: #333;
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1001;
            width: 50px;
            height: 50px;
        }
        #menuToggle:hover {
            transform: scale(1.1);
            color: #3b82f6;
            border-color: #3b82f6;
        }
        .glass-container {
            width: 100%;
            max-width: 1000px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            color: #333;
        }

        h1 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: none;
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .attendance-table th, .attendance-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        .attendance-table thead th {
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .attendance-table tbody tr { transition: background-color 0.3s ease; }
        .attendance-table tbody tr:hover { background-color: rgba(255, 255, 255, 0.5); }
        .attendance-table tbody tr:last-child td { border-bottom: none; }

        .action-button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100px;
            box-shadow: 0 4px 15px 0 rgba(0, 0, 0, 0.1);
        }
        .btn-present {
            background: linear-gradient(45deg, #43e97b, #38f9d7);
            color: #1a5943;
        }
        .btn-absent {
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            color: #794244;
        }
        .action-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px 0 rgba(0, 0, 0, 0.2);
        }
        .action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: rgba(200, 200, 200, 0.8);
            color: #666;
        }

        @media (max-width: 768px) {
            .page-container.shifted { margin-left: 0; }
            .page-container { padding: 1.5rem 1rem; }
            .glass-container { padding: 2rem; }
        }
    </style>
</head>
<body>

<nav id="sidebar" aria-label="Main Navigation">
    <h3>Admin Menu</h3>
    <ul>
        <li><a href="/admin"><i class="fas fa-home"></i> <span>Dashboard</span></a></li>
        <li><a href="/admin/employees"><i class="fas fa-users"></i> <span>Employees</span></a></li>
        <li><a href="/admin/departments"><i class="fas fa-building"></i> <span>Departments</span></a></li>
        <li><a href="/admin/attendance"><i class="fas fa-calendar-check"></i> <span>Attendance</span></a></li>
        <li><a href="/admin/payroll"><i class="fas fa-money-bill-wave"></i> <span>Payroll</span></a></li>
        <li><a href="/admin/reports"><i class="fas fa-chart-pie"></i> <span>Reports</span></a></li>
        <li><a href="/admin/profile"><i class="fas fa-user-circle"></i> <span>Profile</span></a></li>
        <li><a href="/admin/logout"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a></li>
    </ul>
</nav>

<div class="page-container">
    <button id="menuToggle" aria-label="Toggle Navigation Menu" aria-expanded="false" aria-controls="sidebar">
        <i class="fas fa-bars"></i>
    </button>
    <main id="main-content" style="width:100%; display: flex; justify-content: center;">
        <div class="glass-container">
            <h1>Employee Attendance</h1>
            <table class="attendance-table">
                <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Name</th>
                    <th>Mark Present</th>
                    <th>Mark Absent</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.id}">1</td>
                    <td th:text="${emp.name}">John Doe</td>
                    <td>
                        <form th:action="@{/admin/attendance/mark}" method="post" style="display:inline">
                            <input type="hidden" name="employeeId" th:value="${emp.id}">
                            <input type="hidden" name="present" value="true">
                            <button type="submit"
                                    class="action-button btn-present"
                                    th:disabled="${todayAttendance[emp.id] != null && todayAttendance[emp.id].present}">
                                Present
                            </button>
                        </form>
                    </td>
                    <td>
                        <form th:action="@{/admin/attendance/mark}" method="post" style="display:inline">
                            <input type="hidden" name="employeeId" th:value="${emp.id}">
                            <input type="hidden" name="present" value="false">
                            <button type="submit"
                                    class="action-button btn-absent"
                                    th:disabled="${todayAttendance[emp.id] != null && !todayAttendance[emp.id].present}">
                                Absent
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sidebar = document.getElementById('sidebar');
        const pageContainer = document.querySelector('.page-container');
        const menuToggle = document.getElementById('menuToggle');

        if (menuToggle) {
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('active');
                pageContainer.classList.toggle('shifted');
                const isExpanded = sidebar.classList.contains('active');
                menuToggle.setAttribute('aria-expanded', isExpanded);
            });
        }
    });
</script>

</body>
</html>
