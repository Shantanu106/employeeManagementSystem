<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Attendance | Modern UI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #E0EAFC 0%, #CFDEF3 100%);
            padding: 40px;
        }

        .glass-container {
            width: 90%;
            max-width: 1000px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.3); 
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            color: #333;
        }

        h1 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: none; 
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .attendance-table th, .attendance-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .attendance-table thead th {
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .attendance-table tbody tr {
            transition: background-color 0.3s ease;
        }

        .attendance-table tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.5);
        }
        
        .attendance-table tbody tr:last-child td {
            border-bottom: none;
        }


        .action-button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100px;
            box-shadow: 0 4px 15px 0 rgba(0, 0, 0, 0.1);
        }
        .btn-present {
            background: linear-gradient(45deg, #43e97b, #38f9d7); 
            color: #1a5943;
        }

        .btn-absent {
            background: linear-gradient(45deg, #ff9a9e, #fecfef); 
            color: #794244;
        }

        .action-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px 0 rgba(0, 0, 0, 0.2);
        }

        .action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: rgba(200, 200, 200, 0.8);
            color: #666;
        }
    </style>
</head>
<body>

<div class="glass-container">
    <h1>Employee Attendance</h1>

    <table class="attendance-table">
        <thead>
        <tr>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Mark Present</th>
            <th>Mark Absent</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.id}">1</td>
            <td th:text="${emp.name}">John Doe</td>
            <td>
                <form th:action="@{/admin/attendance/mark}" method="post" style="display:inline">
                    <input type="hidden" name="employeeId" th:value="${emp.id}">
                    <input type="hidden" name="present" value="true">
                    <button type="submit"
                            class="action-button btn-present"
                            th:disabled="${todayAttendance[emp.id] != null && todayAttendance[emp.id].present}">
                        Present
                    </button>
                </form>
            </td>
            <td>
                <form th:action="@{/admin/attendance/mark}" method="post" style="display:inline">
                    <input type="hidden" name="employeeId" th:value="${emp.id}">
                    <input type="hidden" name="present" value="false">
                    <button type="submit"
                            class="action-button btn-absent"
                            th:disabled="${todayAttendance[emp.id] != null && !todayAttendance[emp.id].present}">
                        Absent
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
